# Mock Orange internal services (CMS 192.168.22.202, STK, SMS/token) so USSD
# flows complete deterministically in staging and K6 isolates OUR bottlenecks
# from real external latency. Extend with more specific `location` blocks as the
# load-test scenarios need richer canned payloads.
server {
    listen 80 default_server;
    server_name _;
    default_type application/json;

    # Orange SMS OAuth token endpoint.
    location ~* /oauth/.*/token$ {
        return 200 '{"access_token":"mock-token","token_type":"Bearer","expires_in":3600}';
    }

    # STK push (Orange Money) — the engine POSTs here (ORANGE_STK_PUSH_URL).
    location ~* /stk {
        return 200 '{"status":"success","code":200,"message":"STK push accepted (mock)","reference":"MOCK-STK-0001"}';
    }

    # Everything else (CMS get/create user, generic REST) → generic success.
    location / {
        return 200 '{"status":"success","code":200,"message":"mock response","data":{}}';
    }
}
