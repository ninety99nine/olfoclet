# Mock Orange internal services (CMS 192.168.22.202, STK, SMS/token) so USSD
# flows complete deterministically in staging and K6 isolates OUR bottlenecks.
# Response shape mirrors what the builders read: response.subscriber(.metadata,
# .latestSubscription), response.data/meta/links (paginated), successful/message.
server {
    listen 80 default_server;
    server_name _;
    default_type application/json;

    location ~* /oauth/.*/token$ {
        return 200 '{"access_token":"mock-token","token_type":"Bearer","expires_in":3600}';
    }

    location ~* /stk {
        return 200 '{"status":"success","code":200,"message":"STK push accepted (mock)","reference":"MOCK-STK-0001"}';
    }

    # CMS subscriber lookup: subscriber must carry metadata + latestSubscription (nullable).
    location ~* /subscribers {
        return 200 '{"successful":true,"status":"success","code":200,"message":"ok","subscriber":{"id":1,"msisdn":"26771234567","first_name":"Test","last_name":"User","name":"Test User","language":"en","metadata":{},"latestSubscription":null},"subscription":null,"data":[],"meta":{"current_page":1,"last_page":1,"per_page":15,"total":0},"links":{"next":null}}';
    }

    # Generic CMS/REST (lists, content, create): rich shape so no key is undefined.
    location / {
        return 200 '{"successful":true,"status":"success","code":200,"message":"mock response","subscriber":{"id":1,"msisdn":"26771234567","first_name":"Test","last_name":"User","name":"Test User","language":"en","metadata":{},"latestSubscription":null},"subscription":null,"data":[],"meta":{"current_page":1,"last_page":1,"per_page":15,"total":0},"links":{"next":null}}';
    }
}
