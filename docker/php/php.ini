; Application PHP settings for the production-like container.
; Raw errors are never displayed into responses (public/index.php also enforces
; display_errors=0); they are logged to stderr, which Docker captures.
display_errors = Off
log_errors = On
error_log = /dev/stderr
; Hide deprecation/notice noise from old deps on PHP 8.2; real errors still log.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 256M
max_execution_time = 30
; USSD payloads are small; keep uploads modest but allow builder JSON imports.
post_max_size = 32M
upload_max_filesize = 32M

expose_php = Off
date.timezone = UTC
