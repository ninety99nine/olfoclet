; OPcache — report §7.1. Compiles PHP (incl. the ~600KB UssdService.php) once
; instead of re-parsing on every request. validate_timestamps=0 means the cache
; is NOT invalidated on file change — the image is immutable, and a deploy ships
; a new image (fresh OPcache), so this is safe and fastest.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.interned_strings_buffer = 32
opcache.fast_shutdown = 1

; Tracing JIT (Phase 10). Compiles hot interpreted paths to native code. A/B on
; the *217# start flow measured ~+1% alone (that flow is eval-light and eval
; bodies can't be JIT'd); kept as a safe, foundational setting that helps more on
; compute-heavier / eval-heavy flows. Zero behaviour risk (golden-master green).
opcache.jit = tracing
opcache.jit_buffer_size = 64M
