; PHP-FPM pool — Phase 10 load-tested & tuned (2026-07-05).
;
; KEY FINDING: the USSD engine is CPU-bound (~20ms/req intrinsic). On a 2-vCPU
; box, an FPM sweep at 150 concurrent users showed FEWER workers = faster AND
; higher throughput: 8-16 workers gave p95 ~1.2s @ ~70 req/s with load ~15,
; whereas the old dynamic/150 thrashed the scheduler (load ~122, p95 ~2.0s,
; ~62 req/s). Extra workers just fight for the 2 cores.
;
; RULE OF THUMB for the real Orange box: pm.max_children ≈ 6-8 × vCPU
; (static). Raise proportionally to the target box's core count; do NOT size by
; RAM here — CPU is the ceiling, not memory.
;
; static = workers stay warm, so an SMS-campaign burst hits full capacity with
; zero spawn lag. request_terminate_timeout caps a hung CMS call (10s ~ the
; gateway read timeout) so one slow downstream can't pin a worker indefinitely.
[www]
user = www-data
group = www-data
listen = 9000
listen.backlog = 4096          ; queue bursts past max_children instead of refusing

pm = static
pm.max_children = 16           ; 2 vCPU × 8; see sweep in docs/deployment.md
pm.max_requests = 1000         ; periodic recycle guards against any leak

request_terminate_timeout = 10s

; Expose the FPM status page (localhost/exporter only) for php-fpm_exporter in
; Phase 10 monitoring.
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Surface worker stdout/stderr into the container logs.
catch_workers_output = yes
decorate_workers_output = no
