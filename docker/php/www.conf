; PHP-FPM pool — report §7.2. Sized for a single Orange-like box; scale
; pm.max_children to (RAM - ~3GB for OS/Redis/MySQL) / ~45MB per worker.
; request_terminate_timeout caps a hung external call (e.g. slow CMS) so it
; cannot pin a worker forever and cascade into USSD gateway timeouts.
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 150
pm.start_servers = 20
pm.min_spare_servers = 10
pm.max_spare_servers = 40
pm.max_requests = 500

request_terminate_timeout = 15s

; Expose the FPM status page (localhost/exporter only) for php-fpm_exporter in
; Phase 10 monitoring.
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Surface worker stdout/stderr into the container logs.
catch_workers_output = yes
decorate_workers_output = no
