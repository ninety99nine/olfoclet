# Redis — report §7.3. Cache + session + queue backend for Telcoflo V1.
maxmemory 2gb
maxmemory-policy allkeys-lru
tcp-backlog 511
tcp-keepalive 60

# Queues need their jobs to survive a restart, so keep AOF persistence on. (For a
# pure cache you could `save ""` + disable AOF; we run queues here, so we don't.)
appendonly yes
appendfsync everysec
