server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 32M;
    charset utf-8;

    # Static files: serve directly, otherwise hand to the front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # nginx stub_status for the Phase 10 nginx exporter (loopback / internal only).
    location = /nginx-status {
        stub_status;
        allow 127.0.0.1;
        allow 192.168.22.0/24;
        deny all;
    }

    # PHP-FPM (the app container).
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # USSD requests may block briefly on external calls; align with FPM's
        # request_terminate_timeout (15s) plus a small margin.
        fastcgi_read_timeout 20s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
